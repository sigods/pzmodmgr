name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Verify tag matches project version
        run: |
          version=$(sed -n 's/^project(pzmodmgr VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      - name: Package Linux artifacts
        run: ./scripts/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/PZModManager-*-linux-x86_64.sh
            dist/PZModManager-*-linux-x86_64.tar.gz

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Package Windows artifacts
        run: ./scripts/package_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/PZModManager-*-win64-setup.exe
            dist/PZModManager-*-win64.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum PZModManager-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "PZ Mod Manager ${GITHUB_REF_NAME#v}" \
            --generate-notes
